    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('shivshilp-theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        try {
          var redirectPath = sessionStorage.getItem('shivshilp_spa_redirect');
          sessionStorage.removeItem('shivshilp_spa_redirect_attempted');
          if (redirectPath) {
            sessionStorage.removeItem('shivshilp_spa_redirect');
            window.history.replaceState(null, '', redirectPath);
          }
        } catch (e) {}
      })();
    </script>
