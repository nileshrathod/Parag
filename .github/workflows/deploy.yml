name: Deploy ShivShilp Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck and lint
        run: bun run lint

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build production bundle
        env:
          # Uses custom domain root "/" when configured in repository variables,
          # otherwise derives the GitHub Pages project subpath automatically.
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || steps.pages.outputs.base_path || '/' }}
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
